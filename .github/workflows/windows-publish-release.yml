name: Publish verified Windows release

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Exact numeric database ID of the draft GitHub release"
        required: true
      release_tag:
        description: "Exact v-prefixed tag; select the same tag in Use workflow from"
        required: true
      release_commit:
        description: "Exact 40-character source commit recorded in the draft"
        required: true

permissions:
  contents: read

jobs:
  validate-publish-boundary:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_id: ${{ steps.inputs.outputs.release_id }}
      release_tag: ${{ steps.inputs.outputs.release_tag }}
      qualified_ref: ${{ steps.inputs.outputs.qualified_ref }}
      release_commit: ${{ steps.inputs.outputs.release_commit }}
    steps:
      - name: Validate exact publication inputs
        id: inputs
        shell: powershell
        env:
          REQUESTED_RELEASE_ID: ${{ inputs.release_id }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_COMMIT: ${{ inputs.release_commit }}
        run: |
          if ($env:REQUESTED_RELEASE_ID -notmatch '^[1-9]\d{0,18}$') { throw "release_id must be an exact positive numeric GitHub release database ID." }
          [long]$releaseId = 0
          if (-not [long]::TryParse($env:REQUESTED_RELEASE_ID, [ref]$releaseId) -or $releaseId -le 0) { throw "release_id is outside the supported numeric range." }
          if ($env:REQUESTED_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw "release_tag must be a stable vMAJOR.MINOR.PATCH tag." }
          $releaseCommit = $env:REQUESTED_COMMIT.Trim().ToLowerInvariant()
          if ($releaseCommit -notmatch '^[a-f0-9]{40}$') { throw "release_commit must be the exact 40-character commit recorded in the signed draft." }
          "release_id=$releaseId" >> $env:GITHUB_OUTPUT
          "release_tag=$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "qualified_ref=refs/tags/$env:REQUESTED_TAG" >> $env:GITHUB_OUTPUT
          "release_commit=$releaseCommit" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.inputs.outputs.qualified_ref }}
      - name: Bind dispatch, remote tag, and source checkout
        shell: powershell
        env:
          QUALIFIED_REF: ${{ steps.inputs.outputs.qualified_ref }}
          EXPECTED_COMMIT: ${{ steps.inputs.outputs.release_commit }}
          RELEASE_TAG: ${{ steps.inputs.outputs.release_tag }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the exact publication tag." }
          $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
          $fetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
          $triggerCommit = $env:TRIGGER_SHA.Trim().ToLowerInvariant()
          if ($headCommit -ne $env:EXPECTED_COMMIT -or $tagCommit -ne $env:EXPECTED_COMMIT -or $fetchedCommit -ne $env:EXPECTED_COMMIT) {
            throw "The requested source SHA is not the current checkout and freshly fetched tag commit."
          }
          if ($env:TRIGGER_REF -ne $env:QUALIFIED_REF -or $triggerCommit -ne $env:EXPECTED_COMMIT) {
            throw "Run this publication workflow from the exact release tag, not from a branch or another ref."
          }
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG.Substring(1) -ne $packageVersion) { throw "The publication tag does not match package.json at the validated source commit." }

  publish-exact-draft:
    needs: validate-publish-boundary
    runs-on: windows-latest
    timeout-minutes: 30
    environment: windows-release-publish
    concurrency:
      group: windows-release-${{ needs.validate-publish-boundary.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate-publish-boundary.outputs.release_commit }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
      - name: Reverify exact draft and publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_ID: ${{ needs.validate-publish-boundary.outputs.release_id }}
          RELEASE_TAG: ${{ needs.validate-publish-boundary.outputs.release_tag }}
          QUALIFIED_REF: ${{ needs.validate-publish-boundary.outputs.qualified_ref }}
          EXPECTED_COMMIT: ${{ needs.validate-publish-boundary.outputs.release_commit }}
          SIGNING_THUMBPRINT: ${{ vars.BLOCKWRIGHT_SIGNING_THUMBPRINT }}
        run: |
          function Get-ExactRelease {
            param([long]$ReleaseId)
            $releaseText = gh api "repos/$env:RELEASE_REPOSITORY/releases/$ReleaseId"
            if ($LASTEXITCODE -ne 0) { throw "Could not resolve exact GitHub release ID $ReleaseId." }
            return $releaseText | ConvertFrom-Json
          }
          function Assert-ExpectedDraft {
            param($Release, [long]$ReleaseId, [string]$Tag, [string]$Commit)
            if ([long]$Release.id -ne $ReleaseId -or -not [bool]$Release.draft -or [string]$Release.tag_name -ne $Tag) {
              throw "Release ID $ReleaseId is not the expected unpublished $Tag draft."
            }
            if (-not ([string]$Release.body).Contains("Verified source commit: $Commit")) {
              throw "The draft does not record the exact validated source commit."
            }
            if (@($Release.assets).Count -eq 0) { throw "The exact draft contains no release assets." }
          }
          function Get-AssetFingerprint {
            param($Release)
            return (@($Release.assets | Sort-Object id | ForEach-Object {
              "{0}|{1}|{2}|{3}|{4}" -f ([long]$_.id), ([string]$_.name), ([long]$_.size), ([string]$_.updated_at), ([string]$_.digest)
            }) -join "`n")
          }

          [long]$releaseId = [long]$env:RELEASE_ID
          $tag = $env:RELEASE_TAG
          $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          if ($headCommit -ne $env:EXPECTED_COMMIT) { throw "The privileged publication job did not check out the immutable validated source SHA." }
          git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the qualified remote tag before publication-time verification." }
          $tagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
          $fetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
          if ($tagCommit -ne $env:EXPECTED_COMMIT -or $fetchedCommit -ne $env:EXPECTED_COMMIT) {
            throw "The remote release tag moved after unprivileged validation; refusing to execute repository release verification."
          }
          $runnerTemporaryRoot = [System.IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd('\', '/') + [System.IO.Path]::DirectorySeparatorChar
          $downloadRoot = [System.IO.Path]::GetFullPath((Join-Path $env:RUNNER_TEMP "blockwright-publish-$releaseId"))
          if (-not $downloadRoot.StartsWith($runnerTemporaryRoot, [StringComparison]::OrdinalIgnoreCase)) { throw "Refusing an unsafe publication verification directory." }
          if (Test-Path -LiteralPath $downloadRoot) { Remove-Item -LiteralPath $downloadRoot -Recurse -Force }
          $null = New-Item -ItemType Directory -Path $downloadRoot
          try {
            $draft = Get-ExactRelease -ReleaseId $releaseId
            Assert-ExpectedDraft -Release $draft -ReleaseId $releaseId -Tag $tag -Commit $env:EXPECTED_COMMIT
            $assetFingerprint = Get-AssetFingerprint -Release $draft

            gh release download $tag --repo $env:RELEASE_REPOSITORY --dir $downloadRoot
            if ($LASTEXITCODE -ne 0) { throw "Downloading the exact draft assets failed with exit code $LASTEXITCODE." }
            $remoteNames = @($draft.assets | ForEach-Object { [string]$_.name } | Sort-Object)
            $localNames = @(Get-ChildItem -LiteralPath $downloadRoot -File | ForEach-Object { $_.Name } | Sort-Object)
            if (($remoteNames -join "`n") -ne ($localNames -join "`n")) { throw "Downloaded files do not exactly match the draft asset set." }
            $checksumLines = Get-Content -LiteralPath (Join-Path $downloadRoot "SHA256SUMS.txt")
            $checksummedNames = @($checksumLines | ForEach-Object {
              if ($_ -notmatch '^[a-f0-9]{64}\s+\*?([^\\/]+)$') { throw "The downloaded checksum manifest contains an invalid record." }
              $Matches[1]
            } | Sort-Object)
            $expectedNames = @($checksummedNames + "SHA256SUMS.txt" | Sort-Object)
            if (($expectedNames -join "`n") -ne ($localNames -join "`n")) { throw "Every draft asset must be covered by SHA256SUMS.txt, with only the attested checksum manifest outside itself." }

            node scripts/release/verify-release.mjs --dir $downloadRoot --require-signed --require-github-attestation `
              --repository $env:RELEASE_REPOSITORY --source-digest $env:EXPECTED_COMMIT --source-ref $env:QUALIFIED_REF `
              --expected-thumbprint $env:SIGNING_THUMBPRINT
            if ($LASTEXITCODE -ne 0) { throw "Signed bytes or commit-bound GitHub provenance failed publication-time verification." }

            $unchangedDraft = Get-ExactRelease -ReleaseId $releaseId
            Assert-ExpectedDraft -Release $unchangedDraft -ReleaseId $releaseId -Tag $tag -Commit $env:EXPECTED_COMMIT
            if ((Get-AssetFingerprint -Release $unchangedDraft) -ne $assetFingerprint) { throw "The draft asset set changed during publication verification." }

            git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
            if ($LASTEXITCODE -ne 0) { throw "Could not refetch the qualified remote tag immediately before publication." }
            $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
            $tagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
            $fetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
            if ($headCommit -ne $env:EXPECTED_COMMIT -or $tagCommit -ne $env:EXPECTED_COMMIT -or $fetchedCommit -ne $env:EXPECTED_COMMIT) {
              throw "The remote release tag moved after artifact verification; refusing publication."
            }

            $publishBody = @{ draft = $false } | ConvertTo-Json -Compress
            $publishedText = $publishBody | gh api --method PATCH "repos/$env:RELEASE_REPOSITORY/releases/$releaseId" --input -
            if ($LASTEXITCODE -ne 0) { throw "GitHub refused publication of exact release ID $releaseId." }
            $published = $publishedText | ConvertFrom-Json
            if ([long]$published.id -ne $releaseId -or [bool]$published.draft -or [string]$published.tag_name -ne $tag) {
              throw "GitHub did not return the exact published release identity. Inspect release ID $releaseId before retrying."
            }
          } finally {
            if (Test-Path -LiteralPath $downloadRoot -PathType Container) { Remove-Item -LiteralPath $downloadRoot -Recurse -Force }
          }
