name: Windows installer lifecycle

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".codex-plugin/**"
      - ".mcp.json"
      - ".github/workflows/windows-installer-ci.yml"
      - ".github/workflows/windows-release.yml"
      - ".github/workflows/windows-publish-release.yml"
      - "alpic.json"
      - "app/**"
      - "assets/github/**"
      - "data/java/**"
      - "installer/windows/**"
      - "LICENSE"
      - "mcp/**"
      - "package.json"
      - "package-lock.json"
      - "README.md"
      - "scripts/benchmark-v060.ts"
      - "scripts/diagnose.mjs"
      - "scripts/package-plugin.mjs"
      - "scripts/release/**"
      - "scripts/windows/**"
      - "skills/**"
      - "src/**"
      - "standalone/**"
      - "tsconfig.json"
      - "vite.config.ts"
      - "vite.standalone.config.ts"

permissions:
  contents: read

jobs:
  clean-user-install:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - name: Install locked source dependencies
        run: npm ci
      - name: Acquire byte-pinned Inno Setup compiler
        id: inno
        shell: powershell
        run: |
          $inno = & ".\scripts\release\Install-PinnedInnoSetup.ps1" -PassThru
          "iscc_path=$($inno.CompilerPath)" >> $env:GITHUB_OUTPUT
          "installer_path=$($inno.InstallerPath)" >> $env:GITHUB_OUTPUT
      - name: Validate release and Windows scripts
        shell: powershell
        env:
          BLOCKWRIGHT_PINNED_ISCC_PATH: ${{ steps.inno.outputs.iscc_path }}
          BLOCKWRIGHT_PINNED_INNO_INSTALLER_PATH: ${{ steps.inno.outputs.installer_path }}
        run: |
          npm run benchmark:v060
          if ($LASTEXITCODE -ne 0) { throw "The v0.6 benchmark failed with exit code $LASTEXITCODE." }
          npm run test:release
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed with exit code $LASTEXITCODE." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-WindowsDistribution.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows distribution tests failed with exit code $LASTEXITCODE." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-ControlCenter.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Control Center tests failed with exit code $LASTEXITCODE." }
      - name: Build unsigned portable package and per-user installer
        shell: powershell
        run: |
          node scripts/release/build-windows-release.mjs --installer --keep-work --iscc "${{ steps.inno.outputs.iscc_path }}"
          if ($LASTEXITCODE -ne 0) { throw "Unsigned Windows release assembly failed with exit code $LASTEXITCODE." }
      - name: Verify explicit unsigned evidence
        run: npm run release:verify
      - name: Build prior-version fixture from the same staged payload
        shell: powershell
        run: |
          $iscc = "${{ steps.inno.outputs.iscc_path }}"
          $stage = (Resolve-Path ".\release\windows\.work\installer\Blockwright").Path
          $output = Join-Path (Resolve-Path ".\release\windows\.work").Path "fixtures"
          $null = New-Item -ItemType Directory -Path $output -Force
          $manifestPath = Join-Path $stage "release-manifest.json"
          $appManifestPath = Join-Path $stage "app\package.json"
          $manifestOriginal = [IO.File]::ReadAllText($manifestPath)
          $appManifestOriginal = [IO.File]::ReadAllText($appManifestPath)
          try {
            $manifest = $manifestOriginal | ConvertFrom-Json
            $manifest.version = "0.0.1"
            [IO.File]::WriteAllText($manifestPath, (($manifest | ConvertTo-Json -Depth 10) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
            $appManifest = $appManifestOriginal | ConvertFrom-Json
            $appManifest.version = "0.0.1"
            [IO.File]::WriteAllText($appManifestPath, (($appManifest | ConvertTo-Json -Depth 10) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\release\Invoke-PinnedInnoCompile.ps1" `
              -CompilerPath $iscc -Version "0.0.1" -StageDir $stage -OutputDir $output
            if ($LASTEXITCODE -ne 0) { throw "Prior-version installer fixture failed to compile through the pinned compiler boundary." }
          } finally {
            [IO.File]::WriteAllText($manifestPath, $manifestOriginal, [Text.UTF8Encoding]::new($false))
            [IO.File]::WriteAllText($appManifestPath, $appManifestOriginal, [Text.UTF8Encoding]::new($false))
          }
      - name: Exercise install, diagnostics, primary workflow, upgrade, repair, stop, and uninstall
        shell: powershell
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-InstallerRequiredFailure.ps1" `
            -CurrentInstaller ".\release\windows\Blockwright-$version-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer required-failure contract failed with exit code $LASTEXITCODE." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-InstallerLifecycle.ps1" `
            -PreviousInstaller ".\release\windows\.work\fixtures\Blockwright-0.0.1-windows-x64-setup.exe" `
            -CurrentInstaller ".\release\windows\Blockwright-$version-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Installer lifecycle failed with exit code $LASTEXITCODE." }
      - name: Exercise portable private runtime, diagnostics, primary workflow, and isolation
        shell: powershell
        run: |
          $version = (Get-Content -Raw package.json | ConvertFrom-Json).version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-PortableLifecycle.ps1" `
            -PortableZip ".\release\windows\Blockwright-$version-windows-x64-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw "Portable lifecycle failed with exit code $LASTEXITCODE." }
      - name: Upload unsigned CI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blockwright-windows-unsigned-ci
          if-no-files-found: error
          path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/*.json
            release/windows/SHA256SUMS.txt
            ${{ runner.temp }}/Blockwright Installer Lifecycle */logs/*.log
