name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npm run verify:packaged-sync

  windows-control-center:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-ControlCenter.ps1"
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Blockwright-ControlCenter.ps1" -ValidateUi
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Blockwright-ControlCenter.ps1" -SmokeTest -SmokeTestSeconds 60 -Json
