name: Draft signed Windows release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing signed-stable v-prefixed tag to stage; select the same tag in Use workflow from"
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate-release-ref:
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.resolve.outputs.release_tag }}
      qualified_ref: ${{ steps.resolve.outputs.qualified_ref }}
      release_version: ${{ steps.verify.outputs.release_version }}
      release_commit: ${{ steps.verify.outputs.release_commit }}
    steps:
      - name: Validate and qualify release tag
        id: resolve
        shell: powershell
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = ([string]$env:REQUESTED_TAG).Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') { throw "Windows releases require a stable numeric vMAJOR.MINOR.PATCH tag: $tag" }
          $qualifiedRef = "refs/tags/$tag"
          "release_tag=$tag" >> $env:GITHUB_OUTPUT
          "qualified_ref=$qualifiedRef" >> $env:GITHUB_OUTPUT
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ steps.resolve.outputs.qualified_ref }}
      - name: Bind qualified tag to checked-out commit
        id: verify
        shell: powershell
        env:
          QUALIFIED_REF: ${{ steps.resolve.outputs.qualified_ref }}
          RELEASE_TAG: ${{ steps.resolve.outputs.release_tag }}
          TRIGGER_REF: ${{ github.ref }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
          if ($LASTEXITCODE -ne 0) { throw "Could not fetch the validated release tag $env:QUALIFIED_REF." }
          $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
          $fetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
          if ($LASTEXITCODE -ne 0 -or $headCommit -notmatch '^[a-f0-9]{40}$' -or $tagCommit -notmatch '^[a-f0-9]{40}$' -or $fetchedCommit -notmatch '^[a-f0-9]{40}$') { throw "Validated release commit could not be resolved." }
          if ($headCommit -ne $tagCommit -or $headCommit -ne $fetchedCommit) { throw "Checked-out HEAD, local tag, and freshly fetched tag do not resolve to the same commit." }
          $triggerCommit = $env:TRIGGER_SHA.Trim().ToLowerInvariant()
          if ($env:TRIGGER_REF -ne $env:QUALIFIED_REF -or $triggerCommit -ne $headCommit) {
            throw "GitHub's triggering ref/SHA must be the same validated tag commit so artifact attestations bind to the signed source. For manual runs, select the tag itself in Use workflow from."
          }
          $packageVersion = (Get-Content -Raw package.json | ConvertFrom-Json).version
          if ($env:RELEASE_TAG.Substring(1) -ne $packageVersion) { throw "Tag $env:RELEASE_TAG does not match package.json $packageVersion." }
          "release_version=$packageVersion" >> $env:GITHUB_OUTPUT
          "release_commit=$headCommit" >> $env:GITHUB_OUTPUT

  build-sign-verify:
    needs: validate-release-ref
    runs-on: windows-latest
    timeout-minutes: 60
    environment: windows-signing
    concurrency:
      group: windows-release-${{ needs.validate-release-ref.outputs.release_tag }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.validate-release-ref.outputs.qualified_ref }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.8.1
          cache: npm
      - name: Reverify validated tag commit
        shell: powershell
        env:
          QUALIFIED_REF: ${{ needs.validate-release-ref.outputs.qualified_ref }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.release_commit }}
        run: |
          git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
          if ($LASTEXITCODE -ne 0) { throw "Could not refetch the validated release tag in the signing job." }
          $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
          $fetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
          if ($headCommit -ne $env:EXPECTED_COMMIT -or $tagCommit -ne $env:EXPECTED_COMMIT -or $fetchedCommit -ne $env:EXPECTED_COMMIT) {
            throw "Signing checkout is not the commit approved by the unprivileged tag-validation job."
          }
      - name: Install locked source dependencies
        shell: powershell
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed with exit code $LASTEXITCODE." }
      - name: Acquire byte-pinned Inno Setup compiler
        id: inno
        shell: powershell
        run: |
          $inno = & ".\scripts\release\Install-PinnedInnoSetup.ps1" -PassThru
          "iscc_path=$($inno.CompilerPath)" >> $env:GITHUB_OUTPUT
          "installer_path=$($inno.InstallerPath)" >> $env:GITHUB_OUTPUT
      - name: Test source and distribution controls
        shell: powershell
        env:
          BLOCKWRIGHT_PINNED_ISCC_PATH: ${{ steps.inno.outputs.iscc_path }}
          BLOCKWRIGHT_PINNED_INNO_INSTALLER_PATH: ${{ steps.inno.outputs.installer_path }}
        run: |
          npm test
          if ($LASTEXITCODE -ne 0) { throw "npm test failed with exit code $LASTEXITCODE." }
          npm run benchmark:v060
          if ($LASTEXITCODE -ne 0) { throw "The v0.6 benchmark failed with exit code $LASTEXITCODE." }
          npm run test:release
          if ($LASTEXITCODE -ne 0) { throw "Release tests failed with exit code $LASTEXITCODE." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-WindowsDistribution.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Windows distribution tests failed with exit code $LASTEXITCODE." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-ControlCenter.ps1"
          if ($LASTEXITCODE -ne 0) { throw "Control Center tests failed with exit code $LASTEXITCODE." }
          npm run test:windows-launcher
          if ($LASTEXITCODE -ne 0) { throw "Native launcher tests failed with exit code $LASTEXITCODE." }
      - name: Build application payload and unsigned native launcher input
        id: launcher
        shell: powershell
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { throw "Application build failed with exit code $LASTEXITCODE." }
          npm run package:plugin
          if ($LASTEXITCODE -ne 0) { throw "Plugin packaging failed with exit code $LASTEXITCODE." }
          $launcherDirectory = Join-Path $env:RUNNER_TEMP "blockwright-native-launcher"
          $launcherPath = Join-Path $launcherDirectory "Blockwright.exe"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\release\Build-BlockwrightLauncher.ps1" `
            -OutputPath $launcherPath -Version "${{ needs.validate-release-ref.outputs.release_version }}"
          if ($LASTEXITCODE -ne 0) { throw "Native launcher build failed with exit code $LASTEXITCODE." }
          "launcher_path=$launcherPath" >> $env:GITHUB_OUTPUT
      - name: Require external signing configuration
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.BLOCKWRIGHT_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.BLOCKWRIGHT_SIGNING_PFX_PASSWORD }}
          SIGNING_THUMBPRINT: ${{ vars.BLOCKWRIGHT_SIGNING_THUMBPRINT }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD) -or [string]::IsNullOrWhiteSpace($env:SIGNING_THUMBPRINT)) {
            throw "A protected PFX, password, and separately configured trusted thumbprint are required. Unsigned tags are not releasable."
          }
      - name: Sign native launcher, assemble candidate, sign installer, and record proof
        shell: powershell
        env:
          SIGNING_PFX_BASE64: ${{ secrets.BLOCKWRIGHT_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.BLOCKWRIGHT_SIGNING_PFX_PASSWORD }}
          SIGNING_THUMBPRINT: ${{ vars.BLOCKWRIGHT_SIGNING_THUMBPRINT }}
        run: |
          $version = "${{ needs.validate-release-ref.outputs.release_version }}"
          $launcher = "${{ steps.launcher.outputs.launcher_path }}"
          $pfxPath = Join-Path $env:RUNNER_TEMP "blockwright-signing.pfx"
          $certificate = $null
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
            $password = ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            $certificate = Import-PfxCertificate -FilePath $pfxPath -CertStoreLocation Cert:\CurrentUser\My -Password $password -Exportable:$false
            $expected = ($env:SIGNING_THUMBPRINT -replace '[^A-Fa-f0-9]', '').ToUpperInvariant()
            if ($certificate.Thumbprint.ToUpperInvariant() -ne $expected) { throw "Imported signing certificate does not match the configured publisher thumbprint." }
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
            if ($null -eq $signTool) { throw "Windows SignTool was not found." }
            & $signTool.FullName sign /sha1 $expected /fd SHA256 /td SHA256 /tr "https://timestamp.digicert.com" $launcher
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed for Blockwright.exe." }
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\release\Test-BlockwrightLauncherBinary.ps1" `
              -Artifact $launcher -Version $version -ExpectedAuthenticodeStatus Valid -ExpectedThumbprint $expected -RequireTimestamp
            if ($LASTEXITCODE -ne 0) { throw "Post-signing native launcher verification failed with exit code $LASTEXITCODE." }
            node scripts/release/build-windows-release.mjs --skip-source-build --installer `
              --iscc "${{ steps.inno.outputs.iscc_path }}" --launcher-binary $launcher --trusted-publisher-thumbprint $expected
            if ($LASTEXITCODE -ne 0) { throw "Windows release assembly failed with exit code $LASTEXITCODE." }
            $installer = (Resolve-Path ".\release\windows\Blockwright-$version-windows-x64-setup.exe").Path
            $portable = (Resolve-Path ".\release\windows\Blockwright-$version-windows-x64-portable.zip").Path
            & $signTool.FullName sign /sha1 $expected /fd SHA256 /td SHA256 /tr "https://timestamp.digicert.com" $installer
            if ($LASTEXITCODE -ne 0) { throw "SignTool failed for the Blockwright installer." }
            powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\release\Test-BlockwrightAuthenticode.ps1" `
              -Artifact $installer -ExpectedThumbprint $expected `
              -ProofPath ".\release\windows\authenticode-proof.json" `
              -StatusPath ".\release\windows\blockwright-$version-signature-status.json" -Version $version `
              -LauncherArtifact $launcher -PortableArtifact $portable
            if ($LASTEXITCODE -ne 0) { throw "Post-signing Authenticode verification failed with exit code $LASTEXITCODE." }
          } finally {
            if ($null -ne $certificate) { Remove-Item -LiteralPath ("Cert:\CurrentUser\My\" + $certificate.Thumbprint) -Force -ErrorAction SilentlyContinue }
            if (Test-Path -LiteralPath $pfxPath) { Remove-Item -LiteralPath $pfxPath -Force }
          }
      - name: Generate signed update metadata and final checksums
        shell: powershell
        env:
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_REF: ${{ needs.validate-release-ref.outputs.qualified_ref }}
          SIGNING_THUMBPRINT: ${{ vars.BLOCKWRIGHT_SIGNING_THUMBPRINT }}
        run: |
          $version = "${{ needs.validate-release-ref.outputs.release_version }}"
          $tag = "${{ needs.validate-release-ref.outputs.release_tag }}"
          $installer = ".\release\windows\Blockwright-$version-windows-x64-setup.exe"
          $url = "https://github.com/${{ github.repository }}/releases/download/$tag/Blockwright-$version-windows-x64-setup.exe"
          node scripts/release/create-update-metadata.mjs --artifact $installer --artifact-url $url --signature-proof ".\release\windows\authenticode-proof.json" --version $version --out ".\release\windows\latest.json"
          if ($LASTEXITCODE -ne 0) { throw "Update metadata generation failed with exit code $LASTEXITCODE." }
          node scripts/release/write-checksums.mjs --dir ".\release\windows"
          if ($LASTEXITCODE -ne 0) { throw "Final checksum generation failed with exit code $LASTEXITCODE." }
          node scripts/release/verify-release.mjs --dir ".\release\windows" --require-signed `
            --repository $env:RELEASE_REPOSITORY --source-ref $env:RELEASE_REF --expected-thumbprint $env:SIGNING_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw "Signed release verification failed with exit code $LASTEXITCODE." }
      - name: Attest every public Windows release artifact and manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/*.json
            release/windows/SHA256SUMS.txt
          subject-version: ${{ needs.validate-release-ref.outputs.release_version }}
          create-storage-record: false
      - name: Require commit-bound GitHub provenance
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_COMMIT: ${{ needs.validate-release-ref.outputs.release_commit }}
          RELEASE_REF: ${{ needs.validate-release-ref.outputs.qualified_ref }}
          SIGNING_THUMBPRINT: ${{ vars.BLOCKWRIGHT_SIGNING_THUMBPRINT }}
        run: |
          node scripts/release/verify-release.mjs --dir ".\release\windows" --require-signed --require-github-attestation `
            --repository $env:RELEASE_REPOSITORY --source-digest $env:RELEASE_COMMIT --source-ref $env:RELEASE_REF `
            --expected-thumbprint $env:SIGNING_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw "Commit-bound provenance verification failed with exit code $LASTEXITCODE." }
      - name: Exercise exact signed installer failure and success lifecycles
        shell: powershell
        run: |
          $version = "${{ needs.validate-release-ref.outputs.release_version }}"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-InstallerRequiredFailure.ps1" `
            -CurrentInstaller ".\release\windows\Blockwright-$version-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signed installer required-failure contract failed with exit code $LASTEXITCODE." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-InstallerLifecycle.ps1" -CurrentInstaller ".\release\windows\Blockwright-$version-windows-x64-setup.exe"
          if ($LASTEXITCODE -ne 0) { throw "Signed installer lifecycle failed with exit code $LASTEXITCODE." }
      - name: Exercise matching portable private runtime, diagnostics, primary workflow, and isolation
        shell: powershell
        run: |
          $version = "${{ needs.validate-release-ref.outputs.release_version }}"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File ".\scripts\windows\Test-PortableLifecycle.ps1" `
            -PortableZip ".\release\windows\Blockwright-$version-windows-x64-portable.zip"
          if ($LASTEXITCODE -ne 0) { throw "Signed-candidate portable lifecycle failed with exit code $LASTEXITCODE." }
      - name: Upload signed release evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blockwright-windows-${{ needs.validate-release-ref.outputs.release_version }}-signed
          if-no-files-found: error
          path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/*.json
            release/windows/SHA256SUMS.txt
            ${{ runner.temp }}/Blockwright Installer Lifecycle */logs/*.log
      - name: Create draft GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.validate-release-ref.outputs.release_tag }}
          QUALIFIED_REF: ${{ needs.validate-release-ref.outputs.qualified_ref }}
          EXPECTED_COMMIT: ${{ needs.validate-release-ref.outputs.release_commit }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          function Remove-CandidateDraft {
            param([long]$ReleaseId)
            gh api --method DELETE "repos/$env:RELEASE_REPOSITORY/releases/$ReleaseId"
            if ($LASTEXITCODE -ne 0) { throw "Release boundary verification failed and automatic removal of candidate release ID $ReleaseId also failed. Remove the unsafe draft manually before retrying." }
          }
          function Remove-MarkedCandidateDraft {
            param([string]$Tag, [string]$Marker)
            $candidateText = gh api "repos/$env:RELEASE_REPOSITORY/releases/tags/$Tag" 2>$null
            if ($LASTEXITCODE -ne 0) { return $false }
            $candidate = $candidateText | ConvertFrom-Json
            if (-not [bool]$candidate.draft -or [string]$candidate.tag_name -ne $Tag -or -not ([string]$candidate.body).Contains($Marker)) { return $false }
            Remove-CandidateDraft -ReleaseId ([long]$candidate.id)
            return $true
          }
          $tag = $env:RELEASE_TAG
          $runMarker = "blockwright-windows-release-run:$env:RELEASE_RUN_ID/$env:RELEASE_RUN_ATTEMPT"
          git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
          if ($LASTEXITCODE -ne 0) { throw "Could not refetch the validated release tag immediately before draft creation." }
          $headCommit = (git rev-parse HEAD).Trim().ToLowerInvariant()
          $tagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
          $fetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
          if ($headCommit -ne $env:EXPECTED_COMMIT -or $tagCommit -ne $env:EXPECTED_COMMIT -or $fetchedCommit -ne $env:EXPECTED_COMMIT) { throw "Release ref moved after validation; refusing draft creation." }
          $existing = gh release view $tag --json isDraft 2>$null
          if ($LASTEXITCODE -eq 0) { throw "A GitHub release already exists for $tag; refusing to overwrite it." }
          $releaseId = $null
          try {
            $releaseNotes = "Verified source commit: $env:EXPECTED_COMMIT`n`nCandidate run: $runMarker"
            gh release create $tag --verify-tag --draft --title "Blockwright $tag" --notes $releaseNotes --generate-notes
            if ($LASTEXITCODE -ne 0) { throw "Draft GitHub release creation failed with exit code $LASTEXITCODE." }
            $draftText = gh api "repos/$env:RELEASE_REPOSITORY/releases/tags/$tag"
            if ($LASTEXITCODE -ne 0) { throw "Created draft could not be resolved to its immutable release ID." }
            $draft = $draftText | ConvertFrom-Json
            $releaseId = [long]$draft.id
            if ($releaseId -le 0 -or -not [bool]$draft.draft -or [string]$draft.tag_name -ne $tag -or -not ([string]$draft.body).Contains($runMarker)) {
              throw "Created release did not remain the expected marked draft."
            }

            $assetPatterns = @(
              ".\release\windows\*.exe",
              ".\release\windows\*.zip",
              ".\release\windows\*.json",
              ".\release\windows\SHA256SUMS.txt"
            )
            $assets = @($assetPatterns | ForEach-Object { Get-ChildItem -Path $_ -File } | Sort-Object FullName -Unique)
            if ($assets.Count -eq 0) { throw "No verified Windows release assets were found for upload." }
            foreach ($asset in $assets) {
              $encodedName = [uri]::EscapeDataString($asset.Name)
              $uploadEndpoint = "https://uploads.github.com/repos/$env:RELEASE_REPOSITORY/releases/$releaseId/assets?name=$encodedName"
              gh api --method POST -H "Accept: application/vnd.github+json" -H "Content-Type: application/octet-stream" `
                --input $asset.FullName $uploadEndpoint | Out-Null
              if ($LASTEXITCODE -ne 0) { throw "Uploading $($asset.Name) to candidate release ID $releaseId failed with exit code $LASTEXITCODE." }
            }

            git fetch --force --no-recurse-submodules origin $env:QUALIFIED_REF
            if ($LASTEXITCODE -ne 0) { throw "Could not recheck the remote tag after draft asset upload." }
            $postCreateTagCommit = (git rev-parse "$env:QUALIFIED_REF^{commit}").Trim().ToLowerInvariant()
            $postCreateFetchedCommit = (git rev-parse "FETCH_HEAD^{commit}").Trim().ToLowerInvariant()
            if ($postCreateTagCommit -ne $env:EXPECTED_COMMIT -or $postCreateFetchedCommit -ne $env:EXPECTED_COMMIT) {
              throw "Release tag moved during draft creation."
            }
          } catch {
            $releaseFailure = $_
            if ($null -ne $releaseId) {
              Remove-CandidateDraft -ReleaseId $releaseId
            } elseif (-not (Remove-MarkedCandidateDraft -Tag $tag -Marker $runMarker)) {
              throw "Release staging failed before its immutable candidate ID was returned, and no uniquely marked draft could be removed automatically. Confirm that no draft for $tag remains. Original error: $($releaseFailure.Exception.Message)"
            }
            throw $releaseFailure
          }
